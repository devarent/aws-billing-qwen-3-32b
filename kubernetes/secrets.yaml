apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: default
type: Opaque
stringData:
  # Replace these with your actual API keys (JANGAN commit key asli)
  groq-api-key: "REPLACE_WITH_YOUR_GROQ_API_KEY"
  openrouter-api-key: "REPLACE_WITH_YOUR_OPENROUTER_API_KEY"
  gemini-api-key: "REPLACE_WITH_YOUR_GEMINI_API_KEY"
  aws-access-key-id: "REPLACE_WITH_YOUR_AWS_ACCESS_KEY_ID"
  aws-secret-access-key: "REPLACE_WITH_YOUR_AWS_SECRET_ACCESS_KEY"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  GROQ_MODEL: "qwen/qwen-2.5-coder-32b-instruct"
  BEDROCK_MODEL_ID: "qwen.qwen3-next-80b-a3b"
  GCP_PROJECT_ID: "your-gcp-project-id"
  DEBUG: "false"
