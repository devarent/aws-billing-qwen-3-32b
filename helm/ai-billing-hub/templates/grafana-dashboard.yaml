apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-billing-hub.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  billing-dashboard.json: |
    {
      "dashboard": {
        "title": "AI Billing Hub Dashboard",
        "tags": ["billing", "ai", "multi-provider"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "title": "Total Cost by Provider",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "sum(ai_billing_total_cost_usd{provider=\"groq\"})",
                "legendFormat": "Groq"
              },
              {
                "expr": "sum(ai_billing_total_cost_usd{provider=\"openrouter\"})",
                "legendFormat": "OpenRouter"
              },
              {
                "expr": "sum(ai_billing_total_cost_usd{provider=\"bedrock\"})",
                "legendFormat": "Bedrock"
              },
              {
                "expr": "sum(ai_billing_total_cost_usd{provider=\"gemini\"})",
                "legendFormat": "Gemini"
              }
            ],
            "options": {
              "graphMode": "area",
              "orientation": "auto",
              "reduceOptions": {
                "values": false,
                "calcs": ["lastNotNull"],
                "fields": ""
              }
            }
          },
          {
            "id": 2,
            "title": "Total Requests",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "targets": [
              {
                "expr": "sum(ai_billing_total_requests)",
                "legendFormat": "Total"
              }
            ]
          },
          {
            "id": 3,
            "title": "Budget Utilization",
            "type": "gauge",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "ai_billing_budget_utilization{type=\"daily\"}",
                "legendFormat": "Daily"
              },
              {
                "expr": "ai_billing_budget_utilization{type=\"monthly\"}",
                "legendFormat": "Monthly"
              }
            ],
            "options": {
              "max": 100,
              "min": 0,
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "red", "value": 90}
                ]
              }
            }
          },
          {
            "id": 4,
            "title": "Active Users",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
            "targets": [
              {
                "expr": "ai_billing_active_users",
                "legendFormat": "Users"
              }
            ]
          },
          {
            "id": 5,
            "title": "Cost Over Time",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "sum(ai_billing_total_cost_usd) by (provider)",
                "legendFormat": "{{ "{{provider}}" }}"
              }
            ],
            "options": {
              "legend": {"displayMode": "table", "placement": "bottom"},
              "tooltip": {"mode": "multi"}
            }
          },
          {
            "id": 6,
            "title": "Token Consumption",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "sum(ai_billing_total_tokens{type=\"input\"}) by (provider)",
                "legendFormat": "{{ "{{provider}}" }} input"
              },
              {
                "expr": "sum(ai_billing_total_tokens{type=\"output\"}) by (provider)",
                "legendFormat": "{{ "{{provider}}" }} output"
              }
            ],
            "options": {
              "legend": {"displayMode": "table", "placement": "bottom"}
            }
          },
          {
            "id": 7,
            "title": "API Error Rate",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
            "targets": [
              {
                "expr": "rate(ai_billing_api_errors_total[5m])",
                "legendFormat": "{{ "{{provider}}" }} {{ "{{error_type}}" }}"
              }
            ],
            "options": {
              "alert": {
                "conditions": [
                  {
                    "evaluator": {
                      "params": [0.1],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": ["A", "5m", "now"]
                    },
                    "reducer": {
                      "params": [],
                      "type": "avg"
                    },
                    "type": "query"
                  }
                ],
                "executionErrorState": "alerting",
                "frequency": "1m",
                "handler": 1,
                "name": "High Error Rate",
                "noDataState": "no_data",
                "notifications": []
              }
            }
          },
          {
            "id": 8,
            "title": "Budget Alerts",
            "type": "stat",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
            "targets": [
              {
                "expr": "ai_billing_alerts_total{severity=\"warning\"}",
                "legendFormat": "Warnings"
              },
              {
                "expr": "ai_billing_alerts_total{severity=\"critical\"}",
                "legendFormat": "Critical"
              }
            ],
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            }
          }
        ]
      }
    }
