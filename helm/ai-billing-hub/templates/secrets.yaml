apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-billing-hub.fullname" . }}-secrets
type: Opaque
stringData:
  groq-api-key: {{ .Values.secrets.groqApiKey | quote }}
  openrouter-api-key: {{ .Values.secrets.openrouterApiKey | quote }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | quote }}
  aws-access-key-id: {{ .Values.secrets.awsAccessKeyId | quote }}
  aws-secret-access-key: {{ .Values.secrets.awsSecretAccessKey | quote }}
